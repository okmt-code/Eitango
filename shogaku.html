<!doctype html>
<html lang="ja" data-app="shogaku">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>えいご あそび</title>
<style>
:root{
  --bg:#fff8ec; --panel:#ffffff; --ink:#2a2622; --muted:#6f665c; --line:#eadfcd;
  --accent:#ff7a3d; --accent-ink:#ffffff; --blue:#3b7be0; --ok:#1f8a4c; --ok-bg:#dff5e7; --ng:#c62f22; --ng-bg:#fde5e1;
  --chip:#fdf0dc; --low:#ffb347; --high:#4aa3df; --star:#f5b301;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a17; --panel:#26231f; --ink:#f1ece4; --muted:#b3a99c; --line:#3d3830;
    --accent:#ff9a66; --accent-ink:#1c1a17; --blue:#7fb0f5; --ok:#6fd49a; --ok-bg:#1f3828; --ng:#ff8e80; --ng-bg:#43241f;
    --chip:#332e27; --low:#d9973b; --high:#4a91c4; --star:#ffd04d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a17; --panel:#26231f; --ink:#f1ece4; --muted:#b3a99c; --line:#3d3830;
  --accent:#ff9a66; --accent-ink:#1c1a17; --blue:#7fb0f5; --ok:#6fd49a; --ok-bg:#1f3828; --ng:#ff8e80; --ng-bg:#43241f;
  --chip:#332e27; --low:#d9973b; --high:#4a91c4; --star:#ffd04d; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:20px;line-height:1.6;-webkit-tap-highlight-color:transparent}
main{max-width:860px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.en{font-family:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;letter-spacing:.01em}
.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1.1}
.muted{color:var(--muted)}
.small{font-size:16px}
h1{font-size:30px;margin:8px 0 4px;text-align:center}
h2{font-size:24px;margin:20px 0 10px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .title{font-weight:700;font-size:22px;flex:1}
.iconbtn{min-width:56px;min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--panel);font-size:24px;display:inline-flex;align-items:center;justify-content:center;padding:0 12px;gap:6px}
.iconbtn:active,.tile:active,.choice:active,.big:active,.letterbtn:active{transform:scale(.97)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 4px}
.grade button{border:3px solid var(--line);background:var(--panel);border-radius:20px;padding:12px 8px;font-weight:700;font-size:20px;line-height:1.3}
.grade button .emoji{display:block;font-size:40px}
.grade button[aria-pressed="true"].lo{border-color:var(--low);background:color-mix(in srgb,var(--low) 18%,var(--panel))}
.grade button[aria-pressed="true"].hi{border-color:var(--high);background:color-mix(in srgb,var(--high) 18%,var(--panel))}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{border:2px solid var(--line);background:var(--panel);border-radius:20px;padding:14px 12px;text-align:center;font-weight:700;font-size:19px;line-height:1.35;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile .emoji{font-size:44px}
.tile .sub{font-weight:400;font-size:14px;color:var(--muted)}
.tile.disabled{opacity:.45}
.progressline{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 0;justify-content:center}
.pill{background:var(--chip);border-radius:999px;padding:4px 14px;font-size:16px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:18px}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0 12px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--chip);border:2px solid var(--line)}
.dots i.ok{background:var(--ok);border-color:var(--ok)}
.dots i.ng{background:var(--ng);border-color:var(--ng)}
.dots i.now{border-color:var(--accent);transform:scale(1.25)}
.prompt{text-align:center;padding:8px 0}
.prompt .pic{font-size:clamp(96px,26vw,150px)}
.prompt .bigletter{font-size:clamp(110px,30vw,170px);font-weight:700;line-height:1}
.prompt .q{font-size:22px;font-weight:700;margin:6px 0}
.speak{border:none;background:var(--blue);color:#fff;border-radius:999px;min-height:60px;padding:0 24px;font-size:22px;font-weight:700;display:inline-flex;align-items:center;gap:8px;margin:6px}
.speak.slow{background:var(--chip);color:var(--ink);border:2px solid var(--line)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.choices.three{grid-template-columns:1fr 1fr 1fr}
@media (max-width:560px){.choices.three{grid-template-columns:1fr}.choices.words{grid-template-columns:1fr}}
.choice{position:relative;border:3px solid var(--line);background:var(--panel);border-radius:20px;min-height:84px;padding:10px 12px;font-size:30px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.choice .kana{font-size:15px;font-weight:400;color:var(--muted);margin-top:4px}
.choice .n{position:absolute;left:10px;top:6px;font-size:13px;color:var(--muted);font-weight:400}
html[data-input="touch"] .choice .n,html[data-input="touch"] .keys{display:none}
.choice.pic{font-size:64px;min-height:120px}
.choice.letter{font-size:56px;min-height:110px}
.choice.correct{border-color:var(--ok);background:var(--ok-bg)}
.choice.wrong{border-color:var(--ng);background:var(--ng-bg)}
.choice:disabled{cursor:default}
.feedback{text-align:center;font-size:26px;font-weight:700;min-height:1.6em;margin-top:12px}
.feedback .ok{color:var(--ok)} .feedback .ng{color:var(--ng)}
.answer{text-align:center;font-size:18px}
.big{border:none;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-height:64px;padding:0 32px;font-size:24px;font-weight:700}
.big.sub{background:var(--chip);color:var(--ink);border:2px solid var(--line)}
.center{text-align:center}
.mt{margin-top:16px}
.keys{font-size:14px;color:var(--muted);text-align:center;margin-top:14px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:13px;background:var(--chip)}
/* 自作の絵(旗・ようび・つき) */
.flag{display:inline-block;width:1.5em;height:1em;vertical-align:middle;border-radius:.05em;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.week{display:inline-flex;gap:.03em;font-size:.2em;vertical-align:middle;font-family:"Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;line-height:1}
.week i{font-style:normal;width:1.5em;height:2.2em;display:flex;align-items:center;justify-content:center;border:.08em solid var(--line);border-radius:.3em;background:var(--panel);color:var(--muted);font-weight:700}
.week i.sun{color:var(--ng)} .week i.sat{color:var(--blue)}
.week i.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);transform:scale(1.2)}
.month{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:1.1em;height:1.15em;line-height:1;vertical-align:middle;border:.025em solid var(--line);border-top:.1em solid var(--ng);border-radius:.1em;background:var(--panel)}
.month .emoji{font-size:.5em}
.month b{font-size:.26em;color:var(--ink);margin-top:.12em;font-family:"Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif}
.choice.pic .week{font-size:.24em}
.prompt .pic .week{font-size:.3em}
/* つづり */
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.slot{width:54px;height:64px;border-radius:12px;border:3px dashed var(--line);font-size:36px;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.slot.filled{border-style:solid;border-color:var(--blue)}
.slot.ok{border-color:var(--ok);background:var(--ok-bg)}
.slot.ng{border-color:var(--ng);background:var(--ng-bg)}
.tilesrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.ltile{width:62px;height:70px;border-radius:14px;border:3px solid var(--line);background:var(--chip);font-size:36px;font-weight:700}
.ltile:disabled{opacity:.25}
@media (max-width:560px){.panel{padding:14px 10px}.slots,.tilesrow{gap:4px}.slot{width:30px;height:48px;font-size:26px;border-width:2px;border-radius:8px}.ltile{width:44px;height:56px;font-size:30px}}
/* ずかん */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:17px;min-height:48px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--chip);font-weight:700}
.zukan{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.zcard{position:relative;border:2px solid var(--line);background:var(--panel);border-radius:18px;padding:10px 6px;text-align:center;line-height:1.25}
.zcard .emoji{font-size:56px;display:block}
.zcard b{display:block;font-size:22px;margin-top:4px}
.zcard .ja{font-size:16px;color:var(--muted)}
.zcard .kana{font-size:13px;color:var(--muted)}
.zcard .st{position:absolute;right:8px;top:4px;font-size:18px}
.zcard.on{border-color:var(--blue)}
/* アルファベット */
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.letterbtn{border:2px solid var(--line);background:var(--panel);border-radius:16px;min-height:84px;font-size:32px;font-weight:700;position:relative}
.letterbtn .st{position:absolute;right:4px;top:0;font-size:14px}
.lcard{text-align:center}
.lcard .pair{font-size:clamp(110px,30vw,180px);font-weight:700;line-height:1.05}
.lcard .pair span+span{margin-left:.2em;color:var(--blue)}
.lcard .wordline{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px;flex-wrap:wrap}
.lcard .wordline .emoji{font-size:80px}
.lcard .wordline b{font-size:40px}
.lcard .wordline b u{text-decoration:none;color:var(--accent)}
.navrow{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap}
/* けっか */
.stars{font-size:72px;text-align:center;letter-spacing:.1em}
.stars .off{opacity:.2;filter:grayscale(1)}
.result{text-align:center;font-size:26px;font-weight:700}
.reslist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.reslist span{border:2px solid var(--ng);background:var(--ng-bg);border-radius:14px;padding:4px 12px;font-size:20px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-60px;font-size:34px;font-style:normal;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.confetti{display:none}}
/* せってい */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setrow:last-child{border-bottom:none}
select{font:inherit;font-size:17px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%}
.switch{min-width:110px;min-height:48px;border-radius:999px;border:2px solid var(--line);background:var(--chip);font-weight:700}
.switch[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:16px;max-width:min(92vw,560px);z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.note{font-size:15px;color:var(--muted);margin-top:8px}
</style>

function starPts(cx, cy, r, n, ri, rot){
  n = n || 5; ri = ri || r * 0.4; rot = rot || 0; const p = [];
  for (let i = 0; i < n * 2; i++){ const a = rot + Math.PI * i / n - Math.PI / 2, rr = i % 2 ? ri : r; p.push((cx + rr * Math.cos(a)).toFixed(2) + "," + (cy + rr * Math.sin(a)).toFixed(2)); }
  return `<polygon points="${p.join(" ")}" `;
}

const synth = window.speechSynthesis || null;

// 英語の「おもしろ音声」(Bubbles, Zarvox など)は聞き取りにくいので自動では選ばない
const NOVELTY = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Kathy|Organ|Pipe Organ|Princess|Ralph|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley)\b/i;
const PREFER = ["Samantha", "Ava", "Allison", "Susan", "Nicky", "Joelle", "Zoe", "Aria", "Jenny", "Google US English"];
let voices = [];
function loadVoices(){
  try{ voices = (synth.getVoices() || []).filter(v => /^en[-_]/i.test(v.lang)); }catch(e){ voices = []; }
}
function pickVoice(){
  if (S.settings.voice){ const v = voices.find(v => v.name === S.settings.voice); if (v) return v; }
  const score = v => {
    let s = 0;
    if (NOVELTY.test(v.name)) s -= 100;
    if (/^en[-_]US/i.test(v.lang)) s += 4; else if (/^en[-_](GB|AU|CA)/i.test(v.lang)) s += 2;
    if (/Natural|Online|Enhanced|Premium|Neural/i.test(v.name)) s += 3;
    const i = PREFER.findIndex(p => v.name.indexOf(p) >= 0); if (i >= 0) s += 6 - i * 0.2;
    if (/Google/.test(v.name)) s += 2;
    return s;
  };
  return voices.slice().sort((a, b) => score(b) - score(a))[0] || null;
}
let tipShown = false;
function speak(list, rate){
  if (!synth){ toast("このブラウザは よみあげに たいおうしていません。"); return; }
  if (!Array.isArray(list)) list = [list];
  if (!voices.length) loadVoices();
  try{ if (synth.speaking || synth.pending) synth.cancel(); }catch(e){}
  const v = pickVoice();
  list.forEach(text => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; if (v){ u.voice = v; u.lang = v.lang; }
    u.rate = rate || S.settings.rate;
    synth.speak(u);
  });
  if (!tipShown){
    tipShown = true;
    if (!voices.length) setTimeout(() => { loadVoices(); if (!voices.length) toast("英語の こえが みつかりません。おうちの人へ: 端末の設定で英語の読み上げ音声を追加するか、Chrome・Edge・Safari で開いてください。"); }, 600);

let actx = null;
function tone(freqs, dur, type){
  if (!S.settings.sfx) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    let t = actx.currentTime;
    freqs.forEach(f => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
      t += dur * 0.8;
    });
  }catch(e){}
}

/* ===== もんだい ===== */
const spellable = w => /^[a-z]+$/.test(w.en) && w.en.length <= 9;
function startMode(mode){
  if (mode === "zukan"){ view = "zukan"; return render(); }
  if (mode === "abccard"){ view = "abccard"; abcIndex = -1; return render(); }
  if (mode === "settings"){ view = "settings"; return render(); }
  if (["picture", "listen", "spell"].includes(mode)){ Q = {mode}; view = "cat"; return render(); }
  buildQuiz(mode, "");
}
function buildQuiz(mode, cat){
  const g = G(), low = g === "low", n = low ? 3 : 4;
  let pool = WORDS[g].filter(w => !cat || w.cat === cat);
  let qs = [];
  const wordChoices = (w, all) => {
    // 4〜6ねんせいは おなじ なかまから まぎらわしい ものを えらぶ
    const same = all.filter(x => x !== w && x.cat === w.cat && x.pic !== w.pic);
    const other = all.filter(x => x !== w && x.pic !== w.pic);
    let ds = low ? sample(other, n - 1) : sample(same, Math.min(n - 1, same.length));
    ds = ds.concat(sample(other.filter(x => !ds.includes(x)), n - 1 - ds.length));
    return shuffle([w].concat(ds));
  };
  if (mode === "picture" || mode === "listen" || mode === "weak"){
    if (mode === "weak") pool = WORDS[g].filter(w => stat(w.key).weak);
    if (!pool.length){ toast("にがてな ことばは ないよ!"); return; }
    qs = pickItems(pool, NQ).map((w, i) => {
      const type = mode === "weak" ? (i % 2 ? "listen" : "picture") : mode;
      return {type, item: w, choices: wordChoices(w, WORDS[g]), say: w.en};
    });
  } else if (mode === "spell"){
    pool = pool.filter(spellable);
    qs = pickItems(pool, NQ).map(w => ({type: "spell", item: w, say: w.en}));
  } else if (mode === "abclisten"){
    qs = pickItems(ABC, NQ).map(a => ({type: "abclisten", item: a, say: letterSay(a.L), choices: shuffle([a].concat(sample(ABC.filter(x => x !== a), n - 1))), lower: !low}));
  } else if (mode === "abccase"){
    // 4〜6ねんせいは b d p q のような にている もじも まぜる
    const SIM = {b: "dpq", d: "bpq", p: "qbd", q: "pdb", m: "nw", n: "mh", u: "nv", h: "nk", i: "jl", j: "il", f: "tj", t: "fl"};
    qs = pickItems(ABC, NQ).map(a => {
      let ds = [];
      if (!low && SIM[a.l]) ds = SIM[a.l].split("").slice(0, 2).map(c => ABC.find(x => x.l === c));
      ds = ds.concat(sample(ABC.filter(x => x !== a && !ds.includes(x)), n - 1 - ds.length));
      return {type: "abccase", item: a, choices: shuffle([a].concat(ds)), say: letterSay(a.L)};
    });
  } else if (mode === "abcfirst"){
    const src = WORDS[g].filter(w => /^[a-z]/.test(w.en));
    const letters = [...new Set(src.map(w => w.en[0].toUpperCase()))];
    qs = sample(src, NQ).map(w => {
      const L = w.en[0].toUpperCase(), a = ABC.find(x => x.L === L);
      const ds = sample(ABC.filter(x => x.L !== L), n - 1);
      return {type: "abcfirst", item: w, abc: a, choices: shuffle([a].concat(ds)), say: w.en, lower: !low};
    });
  }
  if (!qs.length){ toast("もんだいが ありません"); return; }
  Q = {mode, cat, qs, i: 0, res: [], answered: false};
  view = "quiz"; render(); autoSay();
}
function autoSay(){
  const q = Q.qs[Q.i];
  if (["listen", "abclisten", "abcfirst"].includes(q.type)) setTimeout(() => speak(q.say), 250);
}
function choiceLabel(q, c){
  if (q.type === "picture") return `<span class="en">${esc(c.en)}</span>${kanaOn() ? `<span class="kana">${c.kana}</span>` : ""}`;
  if (q.type === "listen") return `<span class="emoji">${c.pic}</span>`;
  if (q.type === "abclisten") return `<span class="en">${q.lower ? c.l : c.L}</span>`;
  if (q.type === "abccase") return `<span class="en">${c.l}</span>`;
  if (q.type === "abcfirst") return `<span class="en">${q.lower ? c.l : c.L}</span>`;
}
function renderQuiz(){
  const q = Q.qs[Q.i];
  const m = MENU.find(m => m.id === Q.mode);
  const dots = `<div class="dots" aria-label="${Q.i + 1} / ${Q.qs.length} もんめ">${Q.qs.map((_, i) => `<i class="${Q.res[i] === true ? "ok" : Q.res[i] === false ? "ng" : i === Q.i ? "now" : ""}"></i>`).join("")}</div>`;
  let prompt = "";
  if (q.type === "picture") prompt = `<div class="q">この えは えいごで なに?</div><div class="pic emoji">${q.item.pic}</div>`;
  if (q.type === "listen") prompt = `<div class="q">きこえた ことばの えは どれ?</div><button class="speak" data-sayq>🔊 もういちど きく</button><button class="speak slow" data-sayslow>🐢 ゆっくり</button>`;
  if (q.type === "abclisten") prompt = `<div class="q">きこえた もじは どれ?</div><button class="speak" data-sayq>🔊 もういちど きく</button>`;
  if (q.type === "abccase") prompt = `<div class="q">この おおもじの こもじは どれ?</div><div class="bigletter en">${q.item.L}</div>`;
  if (q.type === "abcfirst") prompt = `<div class="q">はじめの もじは どれ?</div><div class="pic emoji">${q.item.pic}</div><button class="speak" data-sayq>🔊 きく</button>`;
  if (q.type === "spell") return renderSpell(q, m, dots);
  const cls = q.type === "listen" ? "pic" : q.type.startsWith("abc") ? "letter" : "";
  $app.innerHTML = topBar(m.name.replace("<br>", "")) + dots + `
    <div class="panel">
      <div class="prompt">${prompt}</div>
      <div class="choices ${q.choices.length === 3 ? "three" : ""} ${q.type === "picture" ? "words" : ""}">
        ${q.choices.map((c, i) => `<button class="choice ${cls}" data-ch="${i}"><span class="n">${i + 1}</span>${choiceLabel(q, c)}</button>`).join("")}
      </div>
      <div class="feedback" id="fb" aria-live="polite"></div>
      <div id="after" class="center"></div>
    </div>`;
  $app.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => answer(+b.dataset.ch));
  bindSay(q);
}
function bindSay(q){
  const b = $app.querySelector("[data-sayq]"); if (b) b.onclick = () => speak(q.say);
  const s = $app.querySelector("[data-sayslow]"); if (s) s.onclick = () => speak(q.say, 0.6);
}
function answerText(q){
  if (q.type === "picture" || q.type === "listen") return `<span class="emoji">${q.item.pic}</span> <b class="en">${esc(q.item.en)}</b> = ${q.item.ja}`;
  if (q.type === "abclisten" || q.type === "abccase") return `<b class="en" style="font-size:40px">${q.item.L} ${q.item.l}</b> <span class="emoji">${q.item.pic}</span> <span class="en">${q.item.word}</span>`;
  if (q.type === "abcfirst") return `<span class="emoji">${q.item.pic}</span> <b class="en"><u>${q.item.en[0]}</u>${esc(q.item.en.slice(1))}</b> = ${q.item.ja}`;
}
function answer(idx){
  if (Q.answered) return;
  const q = Q.qs[Q.i];
  const correctIdx = q.choices.findIndex(c => c === (q.type === "abcfirst" ? q.abc : q.item));
  const ok = idx === correctIdx;
  Q.answered = true; Q.res[Q.i] = ok;
  record(q.type === "abcfirst" ? q.abc.key : q.item.key, ok);
  if (q.type === "abcfirst") record(q.item.key + ":first", ok);
  const btns = $app.querySelectorAll("[data-ch]");
  btns.forEach((b, i) => { b.disabled = true; if (i === correctIdx) b.classList.add("correct"); else if (i === idx) b.classList.add("wrong"); });
  document.getElementById("fb").innerHTML = ok ? `<span class="ok">⭕ せいかい!</span>` : `<span class="ng">❌ おしい!</span>`;
  document.getElementById("after").innerHTML = `<div class="answer">${answerText(q)}</div><button class="big mt" id="next">${Q.i + 1 < Q.qs.length ? "つぎへ ➡️" : "けっかを みる 🎉"}</button>`;
  document.getElementById("next").onclick = next;
  ok ? sfxOk() : sfxNg();
  setTimeout(() => speak(q.type.startsWith("abc") && q.type !== "abcfirst" ? [letterSay(q.item.L)] : q.say), ok ? 350 : 450);
  document.getElementById("next").focus({preventScroll: true});
  document.getElementById("after").scrollIntoView({block: "nearest", behavior: "smooth"});
}
function next(){
  if (!Q.answered) return;
  if (Q.i + 1 >= Q.qs.length){ view = "result"; return render(); }
  Q.i++; Q.answered = false; render(); autoSay();
}

/* --- つづり --- */
function renderSpell(q, m, dots){
  if (!q.tiles){ q.tiles = shuffle(q.item.en.split("").map((ch, i) => ({ch, i}))); q.placed = []; if (q.tiles.map(t => t.ch).join("") === q.item.en && q.item.en.length > 2) q.tiles.reverse(); }
  const w = q.item.en;
  $app.innerHTML = topBar(m.name.replace("<br>", "")) + dots + `
    <div class="panel">
      <div class="prompt"><div class="q">もじを ならべて ことばを つくろう</div><div class="pic emoji">${q.item.pic}</div><div class="small">${q.item.ja}${kanaOn() ? `(${q.item.kana})` : ""}</div>
        <button class="speak" data-sayq>🔊 きく</button></div>
      <div class="slots en" id="slots">${w.split("").map((_, i) => { const t = q.placed[i]; return `<button class="slot ${t ? "filled" : ""}" data-slot="${i}" aria-label="${i + 1}もじめ">${t ? t.ch : ""}</button>`; }).join("")}</div>
      <div class="tilesrow en">${q.tiles.map((t, k) => `<button class="ltile" data-tile="${k}" ${q.placed.includes(t) ? "disabled" : ""}>${t.ch}</button>`).join("")}</div>
      <div class="navrow"><button class="big sub" id="undo">⬅️ ひとつ けす</button></div>
      <div class="feedback" id="fb" aria-live="polite"></div>
      <div id="after" class="center"></div>
    </div>
    <p class="keys">キーボードで もじを うっても いいよ ・ <kbd>Backspace</kbd> ひとつ けす</p>`;
  bindSay(q);
  $app.querySelectorAll("[data-tile]").forEach(b => b.onclick = () => placeTile(q.tiles[+b.dataset.tile]));
  $app.querySelectorAll("[data-slot]").forEach(b => b.onclick = () => { if (Q.answered) return; q.placed = q.placed.slice(0, +b.dataset.slot); render(); });
  document.getElementById("undo").onclick = () => { if (Q.answered) return; q.placed.pop(); render(); };
  if (Q.answered) showSpellResult(q, false);
}
function placeTile(t){
  const q = Q.qs[Q.i];
  if (Q.answered || !t || q.placed.includes(t)) return;
  q.placed.push(t); render();
  if (q.placed.length === q.item.en.length) checkSpell(q);
}
function checkSpell(q){
  const ok = q.placed.map(t => t.ch).join("") === q.item.en;
  Q.answered = true; Q.res[Q.i] = ok; record(q.item.key, ok); record(q.item.key + ":spell", ok);
  render(); showSpellResult(q, true);
}
function showSpellResult(q, fresh){
  const ok = Q.res[Q.i];
  const slots = $app.querySelectorAll("[data-slot]");
  slots.forEach((s, i) => { s.disabled = true; s.classList.add(q.placed[i] && q.placed[i].ch === q.item.en[i] ? "ok" : "ng"); });
  $app.querySelectorAll("[data-tile]").forEach(b => b.disabled = true);
  document.getElementById("undo").disabled = true;
  document.getElementById("fb").innerHTML = ok ? `<span class="ok">⭕ せいかい!</span>` : `<span class="ng">❌ おしい! こたえは <span class="en">${esc(q.item.en)}</span></span>`;
  document.getElementById("after").innerHTML = `<button class="big" id="next">${Q.i + 1 < Q.qs.length ? "つぎへ ➡️" : "けっかを みる 🎉"}</button>`;
  document.getElementById("next").onclick = next;
  if (fresh){ ok ? sfxOk() : sfxNg(); setTimeout(() => speak(q.item.en), 400); }
  document.getElementById("next").focus({preventScroll: true});
}

/* --- けっか --- */
function renderResult(){
  const ok = Q.res.filter(x => x).length, n = Q.qs.length;
  const stars = ok === n ? 3 : ok >= n * 0.7 ? 2 : ok >= n * 0.4 ? 1 : 0;
  const msg = ["つぎは きっと できるよ!", "いいね! そのちょうし!", "すごい! あと すこし!", "パーフェクト! やったね!"][stars];
  const wrong = Q.qs.filter((_, i) => !Q.res[i]);
  const label = q => q.type === "abcfirst" ? `${q.item.pic} ${esc(q.item.en)}` : q.item.L ? `${q.item.L}${q.item.l}` : `${q.item.pic} ${esc(q.item.en)}`;
  $app.innerHTML = topBar("けっか") + `
    <div class="panel center">
      <div class="stars emoji">${[0, 1, 2].map(i => `<span class="${i < stars ? "" : "off"}">⭐</span>`).join("")}</div>
      <div class="result">${n} もん ちゅう ${ok} もん せいかい!</div>
      <p>${msg}</p>
      ${wrong.length ? `<div class="small muted">まちがえた もの</div><div class="reslist en">${wrong.map(q => `<span>${label(q)}</span>`).join("")}</div>` : ""}
      <div class="navrow mt">
        <button class="big" id="again">🔁 もういちど</button>
        <button class="big sub" data-go="home">🏠 ホームへ</button>
      </div>
    </div>`;
  document.getElementById("again").onclick = () => buildQuiz(Q.mode, Q.cat);
  if (stars === 3) confetti();
  if (stars >= 2) tone([784, 988, 1175, 1568], 0.14);
}
function confetti(){
  const c = document.createElement("div"); c.className = "confetti emoji";
  for (let i = 0; i < 24; i++){ const e = document.createElement("i"); e.textContent = ["⭐", "🎉", "✨", "🌟"][i % 4]; e.style.left = Math.random() * 100 + "vw"; e.style.animationDelay = Math.random() * 0.8 + "s"; c.appendChild(e); }
  document.body.appendChild(c); setTimeout(() => c.remove(), 3500);
}

/* ===== そうさ ===== */
$app.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go){
    if (go.getAttribute("aria-disabled") === "true"){ toast(go.dataset.go === "weak" ? "にがてな ことばは いまは ないよ!" : "「4〜6 ねんせい」を えらぶと あそべるよ"); return; }
    if (go.dataset.go === "home"){ try{ synth && synth.cancel(); }catch(err){} view = "home"; render(); return; }
    startMode(go.dataset.go); return;
  }
  const gr = e.target.closest("[data-grade]");
  if (gr){ S.grade = gr.dataset.grade; persist(); render(); return; }
  const cat = e.target.closest("[data-cat]");
  if (cat){ buildQuiz(Q.mode, cat.dataset.cat); return; }
  const zc = e.target.closest("[data-zcat]");
  if (zc){ zukanCat = zc.dataset.zcat; render(); }
});
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.tagName === "SELECT") return;
  if (e.key === "Escape"){ if (view === "abccard" && abcIndex >= 0){ abcIndex = -1; render(); } else { view = "home"; render(); } return; }
  if (view === "abccard" && abcIndex >= 0){
    if (e.key === "ArrowRight"){ abcMove(1); e.preventDefault(); }
    if (e.key === "ArrowLeft"){ abcMove(-1); e.preventDefault(); }
    if (e.key === " "){ sayAbc(); e.preventDefault(); }
    return;
  }
  if (view !== "quiz" || !Q) return;
  const q = Q.qs[Q.i];
  if (e.key === " "){ speak(q.type === "abccase" ? letterSay(q.item.L) : q.say); e.preventDefault(); return; }
  if (e.key === "Enter" && Q.answered){ next(); e.preventDefault(); return; }
  if (q.type === "spell"){
    if (Q.answered) return;
    if (e.key === "Backspace"){ q.placed.pop(); render(); e.preventDefault(); return; }
    if (/^[a-zA-Z]$/.test(e.key)){ placeTile(q.tiles.find(t => !q.placed.includes(t) && t.ch === e.key.toLowerCase())); e.preventDefault(); }
    return;
  }
  if (/^[1-4]$/.test(e.key) && +e.key <= q.choices.length){ answer(+e.key - 1); e.preventDefault(); }
});
render();
</script>
