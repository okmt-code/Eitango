<!doctype html>
<html lang="ja" data-app="index">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英語トレーニング</title>
<link rel="manifest" href="manifest-index.webmanifest">
<link rel="apple-touch-icon" href="icons/index-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英語トレ">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191c" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1f2328;--muted:#646b73;--line:#dcdad3;--accent:#2f5bd3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17191c;--panel:#202328;--ink:#e8e9eb;--muted:#9aa1a9;--line:#363a41;--accent:#7d9cf0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
h1{font-size:22px;margin:8px 0 16px}
a.app{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;color:var(--ink);text-decoration:none;-webkit-tap-highlight-color:transparent}
a.app:active{transform:scale(.98)}
a.app img{width:64px;height:64px;border-radius:14px;flex:none}
a.app b{font-size:18px;display:block}
.muted{color:var(--muted);font-size:14px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:20px;font-size:14px}
.note ol{padding-left:1.3em;margin:6px 0}
</style>
</head>
<body>
<main>
  <h1>英語トレーニング</h1>
  <a class="app" href="eitango.html"><img src="icons/eitango-180.png" alt=""><span><b>英単語トレーニング</b><span class="muted">単語カード・4択クイズ・復習(愛知県公立入試向け)</span></span></a>
  <a class="app" href="bunpou.html"><img src="icons/bunpou-180.png" alt=""><span><b>英文法トレーニング</b><span class="muted">単元ごとの4択・並べかえ・誤り指摘</span></span></a>
  <a class="app" href="shogaku.html"><img src="icons/shogaku-180.png" alt=""><span><b>えいご あそび(小学生)</b><span class="muted">絵を見て答える・聞いて選ぶ・アルファベット(1〜3年 / 4〜6年)</span></span></a>
  <div class="note">
    <b>iPhone・iPad のホーム画面に追加する</b>
    <ol>
      <li>Safari で使いたいアプリを開く</li>
      <li>画面下(iPad は上)の共有ボタンをタップ</li>
      <li>「ホーム画面に追加」→「追加」</li>
    </ol>
    <span class="muted">3つのアプリは別々のアイコンとして追加できます。一度開いておけば、ネットにつながっていなくても使えます。</span>
  </div>
</main>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
